<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- installed / add-to-home-screen launches run fullscreen (incl. iOS,
         which has no Fullscreen API in the browser itself) -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0d0d1a">
    <link rel="manifest" href="manifest.json">
    <title>XFire - Krossfire Skirmish</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231a1a2e'/><text x='50' y='70' font-size='60' fill='%23ff6600' text-anchor='middle' font-weight='bold'>X</text></svg>">
    <script>
        // Boot guard. After a deploy a browser can mix the new index.html
        // with older cached scripts (GitHub Pages caches for 10 minutes),
        // which breaks startup. The ?v= query on every local file prevents
        // that (bump XFIRE_VERSION and the ?v= values on each release); if
        // startup still fails, reload once (revalidates the cache), then
        // show the error instead of hanging on the loading screen.
        window.XFIRE_VERSION = '20261014e';
        window.addEventListener('error', function (e) {
            if (window.__xfireBooted) return;
            var key = 'xfire_boot_retry';
            var tried = false;
            try { tried = sessionStorage.getItem(key) === window.XFIRE_VERSION; } catch (err) { tried = true; }
            if (!tried) {
                try { sessionStorage.setItem(key, window.XFIRE_VERSION); } catch (err) { /* private mode */ }
                location.reload();
                return;
            }
            var show = function () {
                var t = document.getElementById('loadingText');
                if (t) t.textContent = 'Startup failed: ' + (e.message || 'script error') + ' - please reload (Ctrl+Shift+R)';
            };
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show); else show();
        });
    </script>
    <link rel="stylesheet" href="styles.css?v=20261014e">
    <script src="constants.js?v=20261014e"></script>
    <script src="audio.js?v=20261014e"></script>
    <script src="sfx.js?v=20261014e"></script>
    <script src="spriteGenerator.js?v=20261014e"></script>
    <!-- pre-rendered 3D asset pack (tools/asset-baker); optional - the game
         falls back to procedural sprites if these are missing -->
    <script src="assets/sprites/survivors.bundle.js?v=20261014e" defer></script>
    <script src="assets/sprites/evolved.bundle.js?v=20261014e" defer></script>
    <script src="assets/sprites/series9.bundle.js?v=20261014e" defer></script>
    <script>
        // Preload background image before initializing game
        window.addEventListener('DOMContentLoaded', () => {
            const bgImg = new Image();
            bgImg.src = 'assets/mainmenu-bg.png';
            bgImg.onload = () => {
                console.log('✓ Background image loaded');
            };
            bgImg.onerror = () => {
                console.log('⚠ Background image not found, using gradient fallback');
            };
        });
    </script>
</head>
<body>
    <div id="header">
        <div class="hud-brand">
            <span class="hud-logo">XFIRE</span>
            <span class="hud-faction" id="hudFaction"></span>
        </div>
        <div class="hud-stats">
            <div class="hud-chip oil" title="Oil: spend it on structures and units. Derricks pump more.">
                <svg viewBox="0 0 24 24" class="hud-ico"><path d="M12 2c-3.5 5-7 8.6-7 12.5A7 7 0 0 0 19 14.5C19 10.6 15.5 7 12 2z" fill="currentColor"/></svg>
                <strong id="oil">0</strong>
                <span class="hud-sub" id="oilRate">+0/s</span>
            </div>
            <div class="hud-chip units" title="Your units / population cap">
                <svg viewBox="0 0 24 24" class="hud-ico"><circle cx="12" cy="7" r="4" fill="currentColor"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8z" fill="currentColor"/></svg>
                <strong id="playerUnits">0</strong>
            </div>
            <div class="hud-chip tech" title="Tech level - research more at the Research Lab">
                <svg viewBox="0 0 24 24" class="hud-ico"><path d="M9 2h6v2h-1v5.5l5.6 9.7A2 2 0 0 1 17.9 22H6.1a2 2 0 0 1-1.7-2.8L10 9.5V4H9z" fill="currentColor"/></svg>
                <span>T</span><strong id="techLevel">1</strong>
                <span class="hud-sub" id="techProgress"></span>
            </div>
            <div class="hud-chip time" id="timerDisplay" title="Match time">
                <svg viewBox="0 0 24 24" class="hud-ico"><circle cx="12" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 8v5l3 2M9 2h6" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
                <strong id="gameTimer">0:00</strong>
            </div>
        </div>
        <div class="hud-actions">
            <button class="hud-btn" id="hudHelp" title="Controls (F1)">?</button>
            <button class="hud-btn" id="hudPause" title="Pause (P)">&#10073;&#10073;</button>
        </div>
    </div>

    <div id="gameContainer">
        <canvas id="canvas" width="800" height="500"></canvas>
        <div id="touchCmdBar">
            <button id="tcAttack" title="Attack-move">&#9876;</button>
            <button id="tcDeselect" title="Deselect">&#10005;</button>
        </div>
        <button id="tcPause" title="Pause">| |</button>
        <button id="tcFullscreen" title="Fullscreen">&#x26F6;</button>
        <button id="tcSidebar" title="Toggle build menu">&#9654;</button>
        <div id="sidebar">
            <div class="panel panel-minimap">
                <canvas id="minimap" width="240" height="126"></canvas>
            </div>
            <div class="panel panel-selection">
                <div id="selectionInfo"></div>
                <div id="commandBar">
                    <button class="cmd-btn" data-cmd="amove" title="Attack-move (A): march and engage everything on the way"><span class="cmd-ico">&#9876;</span><kbd>A</kbd></button>
                    <button class="cmd-btn" data-cmd="stop" title="Stop (S)"><span class="cmd-ico">&#9632;</span><kbd>S</kbd></button>
                    <button class="cmd-btn" data-cmd="idle" title="Select idle army (Q)"><span class="cmd-ico">&#9673;</span><kbd>Q</kbd></button>
                    <button class="cmd-btn" data-cmd="army" title="Select whole army (F2)"><span class="cmd-ico">&#9733;</span><kbd>F2</kbd></button>
                </div>
            </div>
            <div class="panel panel-build">
                <div id="buildTabs"></div>
                <div id="buildMenu"></div>
            </div>
        </div>
    </div>

    <div id="footer">
        <span id="controlsHelp"></span>
    </div>

    <!-- Background Music -->
    <audio id="introMusic">
        <source src="music/intro.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <audio id="backgroundMusic" loop>
        <source src="music/background.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <!-- Loading Screen -->
    <div id="loadingScreen" class="fullscreen-overlay">
        <div class="loading-container">
            <div class="loading-bar-container">
                <div class="loading-bar" id="loadingBar"></div>
            </div>
            <div class="loading-text" id="loadingText">Loading...</div>
            <button id="goButton" class="menu-btn" style="display: none; margin-top: 20px;">GO</button>
        </div>
    </div>

    <!-- Main Menu Screen -->
    <div id="mainMenu" class="fullscreen-overlay hidden">
        <div class="menu-container">
            <div class="menu-buttons">
                <button id="newGameBtn" class="menu-btn" title="Start right away with your last skirmish settings">Quick Battle</button>
                <button id="settingsBtn" class="menu-btn secondary">Skirmish Setup</button>
                <a id="ironcladBtn" class="menu-btn secondary" href="ironclad.html" style="text-decoration:none;text-align:center;display:inline-block;">Play IRONCLAD</a>
                <a id="underworksBtn" class="menu-btn secondary" href="underworks.html" style="text-decoration:none;text-align:center;display:inline-block;">Play UNDERWORKS</a>
            </div>
        </div>
    </div>

    <!-- Settings Menu Screen -->
    <div id="settingsMenu" class="fullscreen-overlay hidden">
        <div class="menu-container">
            <h1 class="menu-title">Skirmish Setup</h1>
            <div class="settings-panel">
                <div class="setting-group">
                    <label>Your Faction:</label>
                    <select id="playerFactionSelect">
                        <option value="survivors" selected>Survivors - Steel, oil and gunpowder</option>
                        <option value="evolved">Evolved - Flesh, bone and mutant fury</option>
                        <option value="series9">Series 9 - Agricultural robots gone to war</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label>Enemy Faction:</label>
                    <select id="enemyFactionSelect">
                        <option value="random" selected>Random</option>
                        <option value="survivors">Survivors</option>
                        <option value="evolved">Evolved</option>
                        <option value="series9">Series 9</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label>Time Limit:</label>
                    <select id="timeLimitSelect">
                        <option value="unlimited">Unlimited</option>
                        <option value="5">5 Minutes</option>
                        <option value="10">10 Minutes</option>
                        <option value="20" selected>20 Minutes</option>
                        <option value="30">30 Minutes</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label>AI Difficulty:</label>
                    <select id="difficultySelect">
                        <option value="easy">Easy</option>
                        <option value="normal" selected>Normal</option>
                        <option value="hard">Hard</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label>Map Size:</label>
                    <select id="mapSizeSelect">
                        <option value="small">Small (32x32)</option>
                        <option value="medium" selected>Medium (64x64)</option>
                        <option value="large">Large (96x96)</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label>Starting Oil:</label>
                    <select id="startingOilSelect">
                        <option value="3000">3000</option>
                        <option value="5000" selected>5000</option>
                        <option value="8000">8000</option>
                        <option value="12000">12000</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label>Graphics:</label>
                    <select id="graphicsSelect">
                        <option value="pack" selected>Rendered 3D sprites</option>
                        <option value="procedural">Procedural (lightweight)</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label>Guided Start:</label>
                    <select id="tutorialSelect">
                        <option value="on" selected>On - objectives &amp; hints</option>
                        <option value="off">Off</option>
                    </select>
                </div>
            </div>
            <div class="menu-buttons">
                <button id="startGameBtn" class="menu-btn">Start Battle</button>
                <button id="backBtn" class="menu-btn secondary">Back</button>
            </div>
        </div>
    </div>

    <!-- Pause Screen -->
    <div id="pauseScreen" class="fullscreen-overlay hidden">
        <div class="menu-container">
            <h1 class="menu-title">PAUSED</h1>
            <div class="pause-settings">
                <div class="mixer-row">
                    <label for="musicVolume">Music</label>
                    <input type="range" id="musicVolume" min="0" max="100" value="50">
                </div>
                <div class="mixer-row">
                    <label for="sfxVolume">Effects</label>
                    <input type="range" id="sfxVolume" min="0" max="100" value="100">
                </div>
                <div class="mixer-row">
                    <label for="voiceVolume">Voices</label>
                    <input type="range" id="voiceVolume" min="0" max="100" value="55">
                </div>
                <label class="toggle-setting">
                    <input type="checkbox" id="announcerToggle" checked>
                    <span>Announcer voice</span>
                </label>
                <label class="toggle-setting">
                    <input type="checkbox" id="combatSoundToggle" checked>
                    <span>Combat Sounds</span>
                </label>
            </div>
            <div class="menu-buttons">
                <button id="resumeBtn" class="menu-btn">Resume (P)</button>
                <button id="quitBtn" class="menu-btn secondary">Quit to Menu</button>
            </div>
        </div>
    </div>

    <!-- Victory Screen -->
    <div id="victoryScreen" class="fullscreen-overlay hidden">
        <div class="menu-container">
            <h1 class="menu-title victory-title">VICTORY!</h1>
            <p class="victory-info">You have defeated all enemy forces!</p>
            <div id="victoryStats" class="stats-box"></div>
            <div class="menu-buttons">
                <button id="playAgainBtn" class="menu-btn">Play Again</button>
                <button class="menu-btn secondary menu-return">Main Menu</button>
            </div>
        </div>
    </div>

    <!-- Defeat Screen -->
    <div id="defeatScreen" class="fullscreen-overlay hidden">
        <div class="menu-container">
            <h1 class="menu-title defeat-title">DEFEAT!</h1>
            <p class="defeat-info">All your forces have been eliminated.</p>
            <div id="defeatStats" class="stats-box"></div>
            <div class="menu-buttons">
                <button id="retryBtn" class="menu-btn">Retry</button>
                <button class="menu-btn secondary menu-return">Main Menu</button>
            </div>
        </div>
    </div>

    <div id="rotateHint">
        <div class="phone">&#128241;</div>
        <div>ROTATE YOUR DEVICE<br>XFIRE PLAYS IN LANDSCAPE</div>
    </div>

    <script defer src="terrain.js?v=20261014e"></script>
    <script defer src="render.js?v=20261014e"></script>
    <script defer src="game-engine.js?v=20261014e"></script>
    <script>
        // Menu background FX: spots in image pixels of mainmenu-bg.png
        // (1536x1024); styles.css maps them onto the cover background.
        (function () {
            var S = [
                // left tank: muzzle (450,550), tracer to (630,525)
                ['halo',  450, 550, 70, '--t:2.1s'],
                ['beam',  450, 550, 0,  '--len:182;--a:-7.9deg;--w:10;--t:1.3s'],
                ['fire',  450, 550, 20, '--t:1.5s'],
                ['shot',  452, 549, 46, '--t:4.6s;--d:0.8s'],
                // mech cannon: muzzle (1014,441), tracer to (855,401)
                ['halo',  1014, 441, 72, '--t:2.6s;--d:0.4s'],
                ['beam',  1014, 441, 0,  '--len:166;--a:-165.9deg;--w:11;--t:0.9s;--d:0.2s'],
                ['fire',  1014, 441, 22, '--t:1.2s;--d:0.3s'],
                ['shot',  1012, 440, 52, '--t:3.7s;--d:2.1s'],
                // lower right tank: muzzle (1208,706), tracer to (1100,720)
                ['halo',  1208, 706, 64, '--t:2.3s;--d:1.1s'],
                ['beam',  1208, 706, 0,  '--len:110;--a:172.6deg;--w:9;--t:1.15s;--d:0.5s'],
                ['fire',  1208, 706, 20, '--t:1.7s;--d:0.9s'],
                ['shot',  1206, 706, 44, '--t:5.3s;--d:3.4s'],
                // distant impact in the haze
                ['spark', 928, 578, 14, '--t:1.9s;--d:0.6s'],
                // sparking cables
                ['halo',  779, 837, 40, '--t:1.4s'],
                ['spark', 779, 837, 18, '--t:0.85s'],
                ['halo',  897, 820, 38, '--t:1.6s;--d:0.5s'],
                ['spark', 897, 820, 17, '--t:0.7s;--d:0.3s'],
                // mech optics and the green reactor core
                ['pulse', 1238, 487, 14, '--t:2.8s;--c:rgba(255,80,40,0.8)'],
                ['pulse', 766, 522, 34, '--t:3.4s;--c:rgba(120,255,140,0.35)']
            ];
            var html = S.map(function (p) {
                return '<i class="' + p[0] + '" style="--x:' + p[1] + ';--y:' + p[2] + ';--r:' + p[3] + ';' + p[4] + '"></i>';
            }).join('');
            ['loadingScreen', 'mainMenu', 'settingsMenu'].forEach(function (id) {
                var host = document.getElementById(id);
                if (!host) return;
                var d = document.createElement('div');
                d.className = 'bg-fx';
                d.setAttribute('aria-hidden', 'true');
                d.innerHTML = html;
                host.insertBefore(d, host.firstChild);
            });
            // scale = what 'background-size: cover' uses for the real box
            function fit() {
                var boxes = document.querySelectorAll('.bg-fx');
                for (var i = 0; i < boxes.length; i++) {
                    var b = boxes[i], w = b.clientWidth, h = b.clientHeight;
                    if (!w || !h) { w = window.innerWidth; h = window.innerHeight; }
                    b.style.setProperty('--s', Math.max(w / 1536, h / 1024) + 'px');
                }
            }
            fit();
            window.addEventListener('resize', fit);
            window.addEventListener('orientationchange', function () { setTimeout(fit, 150); });
            if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
            // menus switch with display:none -> measure again when shown
            new MutationObserver(fit).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['class'] });
        })();
    </script>
</body>
</html>
