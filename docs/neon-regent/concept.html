<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON REGENT – Konzept-Render</title>
<!--
  Konzept-Render für NEON REGENT (siehe PLAN.md). KEIN Spielcode, sondern eine
  Referenz für die zwei neuen Render-Techniken, die Ironclad nicht hat:
    1. Pseudo-3D-Gebäude im GTA-2-Stil: Dach um D = (B - C) * h * LEAN_K
       verschoben, sichtbare Fassaden als Parallelogramme, Textur per
       ctx.transform() affin gemappt (exakt, 1 drawImage pro Fassade).
    2. Nacht-Licht aus Underworks: Dunkelheitsschicht (halbe Auflösung) mit
       destination-out-Löchern, danach farbige additive Lichtpfützen.
  Fahrzeuge sind die echten Ironclad-Sprites (assets/sprites/ironclad.bundle.js),
  per Lackmaske umgefärbt - genau so soll die Pipeline später mit eigenen
  Stadtmodellen aussehen. Läuft auch von file://.
-->
<style>
:root {
  --accent: #3fe8ff; --accent-hi: #a8f6ff; --accent2: #ff3fa4;
  --bg: #06070c; --panel: rgba(8, 10, 18, 0.80); --line: rgba(63, 232, 255, 0.30);
  --text: #e6ecf5; --muted: #8a93a6; --danger: #ff3b4a; --good: #57e07a;
  --font-display: 'Arial Black', 'Arial Bold', 'Helvetica Neue', Verdana, sans-serif;
  --font-ui: 'Segoe UI', 'Trebuchet MS', 'DejaVu Sans', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-ui); overflow: hidden; }
#wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at 50% 30%, #121626 0%, #06070c 70%); }
canvas { display: block; border-radius: 6px; box-shadow: 0 0 0 1px rgba(63,232,255,0.18), 0 30px 80px rgba(0,0,0,0.6); }
#hud { position: absolute; pointer-events: none; font-family: var(--font-display); }
.col { position: absolute; display: flex; flex-direction: column; gap: 6px; }
.tl { left: 12px; top: 12px; } .tr { right: 12px; top: 12px; align-items: flex-end; }
.card { background: linear-gradient(180deg, rgba(12,14,26,0.80), rgba(6,8,14,0.80)); border: 1px solid var(--line);
  border-radius: 6px; padding: 7px 12px; display: flex; align-items: center; gap: 10px; box-shadow: 0 6px 18px rgba(0,0,0,0.35); }
.lbl { font-size: 10px; letter-spacing: 3px; color: var(--muted); }
.val { font-size: 18px; color: var(--accent-hi); letter-spacing: 1px; text-shadow: 0 0 12px rgba(63,232,255,0.55); }
.bar { position: relative; width: 170px; height: 10px; background: rgba(0,0,0,0.55); border-radius: 3px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; }
#vital { width: 72%; background: linear-gradient(90deg, #36c763, #a6ff6a); box-shadow: 0 0 10px rgba(87,224,122,0.6); }
#armor { width: 35%; background: linear-gradient(90deg, #3aa8ff, #9fe6ff); }
.chip { color: var(--danger); font-size: 11px; letter-spacing: 3px; text-shadow: 0 0 12px rgba(255,59,74,0.9); }
.chip b { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 10px var(--danger); margin-right: 6px; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
.keys { display: flex; gap: 4px; }
.keys svg { width: 18px; height: 18px; }
#mandate { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); text-align: center; }
#mandate .t { font-size: 10px; letter-spacing: 5px; color: var(--accent2); text-shadow: 0 0 12px rgba(255,63,164,0.85); }
#mandate .c { font-size: 26px; letter-spacing: 4px; color: #ffd84a; text-shadow: 0 0 16px rgba(255,200,60,0.8); }
#pager { position: absolute; left: 12px; bottom: 12px; width: 430px; padding: 10px 14px; display: flex; gap: 12px; align-items: flex-start;
  background: linear-gradient(180deg, rgba(20,6,18,0.86), rgba(8,4,10,0.86)); border: 1px solid rgba(255,63,164,0.45); border-radius: 6px;
  box-shadow: 0 0 24px rgba(255,63,164,0.18); }
#pager .who { font-size: 10px; letter-spacing: 4px; color: var(--accent2); margin-bottom: 4px; }
#pager .msg { font-family: var(--font-ui); font-size: 13px; line-height: 1.45; color: var(--text); }
#weapon { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="col tl">
      <div class="card"><span class="lbl">VITAL</span><div class="bar"><i id="vital"></i></div></div>
      <div class="card"><span class="lbl">PANZER</span><div class="bar" style="height:5px"><i id="armor"></i></div></div>
      <div class="card"><span class="chip"><b></b>TREUECHIP AKTIV</span></div>
    </div>
    <div id="mandate" class="card" style="flex-direction:column;gap:2px">
      <div class="t">MANDAT 02 · TRIBUTEINTREIBUNG</div>
      <div class="c">02:31</div>
    </div>
    <div class="col tr">
      <div class="card"><span class="lbl">CREDITS</span><span class="val">12.450</span></div>
      <div class="card"><span class="lbl">FAHNDUNG</span><span class="keys" id="keys"></span></div>
    </div>
    <div id="pager">
      <svg width="38" height="38" viewBox="0 0 38 38"><circle cx="19" cy="19" r="17" fill="none" stroke="#ff3fa4" stroke-width="2"/>
        <ellipse cx="19" cy="19" rx="12" ry="6" fill="none" stroke="#ff3fa4" stroke-width="2"/><circle cx="19" cy="19" r="3.5" fill="#ff3fa4"/></svg>
      <div><div class="who">MANDAT ▸ EINGEHEND</div>
        <div class="msg">Nummer 7741. Drei Händler am Fischmarkt sind mit der Regentensteuer im Rückstand. Treiben Sie sie ein. Der Regent wacht.</div></div>
    </div>
    <div id="weapon" class="card"><span class="lbl">PISTOLE</span><span class="val">84</span></div>
  </div>
</div>
<script src="../../assets/sprites/ironclad.bundle.js"></script>
<script>
'use strict';
// ------------------------------------------------------------------
// Setup + helpers
// ------------------------------------------------------------------
const VIEW_W = 1280, VIEW_H = 720, T = 64;
const LEAN_K = 1 / 1000;        // Gebäude-Neigung: D = (Mitte - Kamera) * Höhe * LEAN_K
const LEAN_MAX = 0.65;          // |D| <= 0.65 * Höhe (Bildrand nicht zu extrem)
const FLOOR_H = 22;             // px pro Stockwerk
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
canvas.width = VIEW_W; canvas.height = VIEW_H;
const hud = document.getElementById('hud');
function fit() {
  const s = Math.min((innerWidth - 24) / VIEW_W, (innerHeight - 24) / VIEW_H);
  const w = Math.floor(VIEW_W * s), h = Math.floor(VIEW_H * s);
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  const r = canvas.getBoundingClientRect();
  Object.assign(hud.style, { left: r.left + 'px', top: r.top + 'px', width: w + 'px', height: h + 'px' });
}
fit(); addEventListener('resize', fit);

let seed = 7741;
function rnd() { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const R = (a, b) => a + rnd() * (b - a), RI = (a, b) => Math.floor(R(a, b + 1)), PICK = (a) => a[(rnd() * a.length) | 0];
const TAU = Math.PI * 2, clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
const SPR = new Map();
function sprite(key, w, h, fn) { let c = SPR.get(key); if (c) return c; c = mk(w, h); const g = c.getContext('2d'); g.translate(w / 2, h / 2); fn(g); SPR.set(key, c); return c; }
function lightSprite(color) {
  return sprite('light|' + color, 128, 128, g => { const gr = g.createRadialGradient(0, 0, 0, 0, 0, 64);
    gr.addColorStop(0, rgba(color, 0.9)); gr.addColorStop(0.5, rgba(color, 0.3)); gr.addColorStop(1, rgba(color, 0)); g.fillStyle = gr; g.fillRect(-64, -64, 128, 128); });
}
function glowSprite(color) {
  return sprite('glow|' + color, 128, 128, g => { const gr = g.createRadialGradient(0, 0, 0, 0, 0, 64);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.18, rgba(color, 0.95)); gr.addColorStop(0.45, rgba(color, 0.35)); gr.addColorStop(1, rgba(color, 0)); g.fillStyle = gr; g.fillRect(-64, -64, 128, 128); });
}
function coneSprite(color) {   // Scheinwerferkegel, Spitze links-mittig, öffnet nach +x
  return sprite('cone|' + color, 256, 160, g => {
    g.translate(-128, 0);
    const gr = g.createRadialGradient(0, 0, 0, 0, 0, 256);
    gr.addColorStop(0, rgba(color, 0.95)); gr.addColorStop(0.6, rgba(color, 0.35)); gr.addColorStop(1, rgba(color, 0));
    g.fillStyle = gr; g.filter = 'blur(6px)';
    g.beginPath(); g.moveTo(4, -6); g.lineTo(250, -70); g.lineTo(250, 70); g.lineTo(4, 6); g.closePath(); g.fill();
    g.filter = 'none';
  });
}

// ------------------------------------------------------------------
// Ironclad-Spritepack (16 Ansichten + Lackmaske) - Code aus ironclad.html
// ------------------------------------------------------------------
const PACK = { ready: false, src: {}, sheets: new Map() }, PACK_OUT = 2;
function grayToAlpha(img) { const c = mk(img.width, img.height), g = c.getContext('2d'); g.drawImage(img, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height), a = d.data;
  for (let i = 0; i < a.length; i += 4) { a[i + 3] = a[i] > 6 ? a[i] : 0; a[i] = a[i + 1] = a[i + 2] = 0; }
  g.putImageData(d, 0, 0); return c; }
function loadPack(cb) {
  const A = window.IRONCLAD_ASSETS; if (!A) { cb(); return; }
  let left = 0; const done = () => { if (--left > 0) return;
    for (const e of Object.values(PACK.src)) { e.mask = grayToAlpha(e.maskImg); e.shadow = e.shadowImg ? grayToAlpha(e.shadowImg) : null; }
    PACK.ready = true; cb(); };
  const img = (u) => { if (!u) return null; left++; const i = new Image(); i.onload = done; i.src = u; return i; };
  for (const n in A) PACK.src[n] = { ...A[n], colorImg: img(A[n].color), maskImg: img(A[n].mask), shadowImg: img(A[n].shadow) };
}
function packSheet(name, color) {
  if (!PACK.ready) return null; const e = PACK.src[name]; if (!e) return null;
  const key = name + '|' + color; let ps = PACK.sheets.get(key); if (ps) return ps;
  const sheet = mk(e.colorImg.width, e.colorImg.height), g = sheet.getContext('2d'); g.drawImage(e.colorImg, 0, 0);
  if (color) { const t = mk(sheet.width, sheet.height), tg = t.getContext('2d'); tg.drawImage(e.mask, 0, 0);
    tg.globalCompositeOperation = 'source-in'; tg.fillStyle = color; tg.fillRect(0, 0, t.width, t.height);
    g.globalCompositeOperation = 'multiply'; g.drawImage(t, 0, 0); g.globalCompositeOperation = 'destination-in'; g.drawImage(e.colorImg, 0, 0); g.globalCompositeOperation = 'source-over'; }
  ps = { key, sheet, shadow: e.shadow, cell: e.cell * PACK_OUT, dirs: e.dirs, ref: e.ref }; PACK.sheets.set(key, ps); return ps;
}
function drawPack(g, ps, layer, x, y, ang, size, alpha = 1) {
  const img = ps[layer]; if (!img) return;
  const step = TAU / ps.dirs, d0 = Math.round(ang / step), d = ((d0 % ps.dirs) + ps.dirs) % ps.dirs, rest = ang - d0 * step;
  const c = ps.cell, k = size / ps.ref / PACK_OUT;
  g.save(); g.translate(x, y); g.rotate(rest); g.scale(k, k); if (alpha !== 1) g.globalAlpha *= alpha;
  g.drawImage(img, d * c, 0, c, c, -c / 2, -c / 2, c, c); g.restore();
}

// ------------------------------------------------------------------
// Welt: 26x16 Kacheln, Straßen (2 Spuren), Gehwege (1 Kachel), Grundstücke
// ------------------------------------------------------------------
const GW = 26, GH = 16, WORLD_W = GW * T, WORLD_H = GH * T;
const ROAD = 1, WALK = 2, LOT = 0;
const roadCols = [9, 10, 19, 20], roadRows = [7, 8];
const grid = new Uint8Array(GW * GH);
for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) if (roadCols.includes(x) || roadRows.includes(y)) grid[y * GW + x] = ROAD;
for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
  if (grid[y * GW + x] === ROAD) continue;
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    const nx = x + dx, ny = y + dy;
    if (nx >= 0 && ny >= 0 && nx < GW && ny < GH && grid[ny * GW + nx] === ROAD) grid[y * GW + x] = WALK;
  }
}
// Gebäude: jedes Grundstück entlang der langen Achse in 2-3 Blöcke teilen, ab und zu eine Gasse
const buildings = [];
const lots = [];
for (const [x0, x1] of [[0, 7], [12, 17], [22, 25]]) for (const [y0, y1] of [[0, 5], [10, 15]]) lots.push([x0, y0, x1 + 1, y1 + 1]);
for (const [x0, y0, x1, y1] of lots) {
  const horiz = (x1 - x0) >= (y1 - y0);
  const len = horiz ? x1 - x0 : y1 - y0;
  const cuts = [0]; let p = 0;
  while (p < len) { const s = clamp(RI(2, 4), 1, len - p); p += s; cuts.push(p); }
  for (let i = 0; i < cuts.length - 1; i++) {
    let a = cuts[i], b = cuts[i + 1];
    const alley = b - a >= 3 && rnd() < 0.35;          // 1/2 Kachel Gasse
    const bx0 = horiz ? x0 + a : x0, bx1 = horiz ? x0 + b : x1, by0 = horiz ? y0 : y0 + a, by1 = horiz ? y1 : y0 + b;
    const inset = 2, gap = alley ? T / 2 : 0;
    const floors = RI(5, 15);
    buildings.push({ x0: bx0 * T + inset, y0: by0 * T + inset, x1: bx1 * T - inset - (horiz ? gap : 0), y1: by1 * T - inset - (horiz ? 0 : gap),
      h: floors * FLOOR_H, style: PICK(['concrete', 'concrete', 'glass', 'neon', 'neon']), id: buildings.length });
  }
}
// ein Turm mit dem Regenten-Hologramm auf dem Dach
const tower = buildings.filter(b => b.x0 >= 12 * T - 4 && b.x1 <= 18 * T + 4 && b.y0 > 600).reduce((m, b) => ((b.x1 - b.x0) * (b.y1 - b.y0) > (m.x1 - m.x0) * (m.y1 - m.y0) ? b : m));
tower.h = 24 * FLOOR_H; tower.style = 'glass'; tower.regent = true;

// Laternen an den Bordsteinen, alle 3 Kacheln
const lamps = [];
for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
  if (grid[y * GW + x] !== WALK || (x + y) % 3) continue;
  const cx = x * T + T / 2, cy = y * T + T / 2;
  // Richtung zur Straße suchen -> Laterne an die Bordsteinkante setzen
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
    const nx = x + dx, ny = y + dy;
    if (nx >= 0 && ny >= 0 && nx < GW && ny < GH && grid[ny * GW + nx] === ROAD) {
      lamps.push({ x: cx + dx * 22, y: cy + dy * 22, h: 70, color: rnd() < 0.8 ? '#ffb35c' : '#cfe6ff', flick: rnd() < 0.15 }); break;
    }
  }
}

// ------------------------------------------------------------------
// Boden (einmal gemalt, wie Ironclads buildDesert)
// ------------------------------------------------------------------
const ground = mk(WORLD_W, WORLD_H);
(function paintGround() {
  const g = ground.getContext('2d');
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
    const t = grid[y * GW + x], px = x * T, py = y * T;
    g.fillStyle = t === ROAD ? '#5a5e69' : t === WALK ? '#727784' : '#43464f';
    g.fillRect(px, py, T, T);
    if (t === WALK) {      // Gehwegplatten
      g.strokeStyle = 'rgba(0,0,0,0.28)'; g.lineWidth = 1;
      for (let k = 0; k <= T; k += 16) { g.beginPath(); g.moveTo(px + k, py); g.lineTo(px + k, py + T); g.moveTo(px, py + k); g.lineTo(px + T, py + k); g.stroke(); }
      for (let k = 0; k < 3; k++) { g.fillStyle = `rgba(255,255,255,${R(0.02, 0.05)})`; g.fillRect(px + RI(0, 3) * 16, py + RI(0, 3) * 16, 16, 16); }
    }
  }
  // Asphalt-Rauschen
  for (let i = 0; i < 26000; i++) { const x = R(0, WORLD_W), y = R(0, WORLD_H); g.fillStyle = `rgba(${rnd() < 0.5 ? '0,0,0' : '255,255,255'},${R(0.03, 0.08)})`; g.fillRect(x, y, R(1, 3), R(1, 3)); }
  // Bordsteinkanten
  g.strokeStyle = 'rgba(205,212,228,0.55)'; g.lineWidth = 3;
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
    if (grid[y * GW + x] !== WALK) continue;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= GW || ny >= GH || grid[ny * GW + nx] !== ROAD) continue;
      const ex = x * T + (dx > 0 ? T : 0), ey = y * T + (dy > 0 ? T : 0);
      g.beginPath(); if (dx) { g.moveTo(ex, y * T); g.lineTo(ex, y * T + T); } else { g.moveTo(x * T, ey); g.lineTo(x * T + T, ey); } g.stroke();
    }
  }
  // Mittellinien (gestrichelt) und Zebrastreifen
  g.setLineDash([18, 14]); g.strokeStyle = 'rgba(235,240,250,0.75)'; g.lineWidth = 2;
  for (const r of [7]) { g.beginPath(); g.moveTo(0, (r + 1) * T); g.lineTo(WORLD_W, (r + 1) * T); g.stroke(); }
  for (const c of [9, 19]) { g.beginPath(); g.moveTo((c + 1) * T, 0); g.lineTo((c + 1) * T, WORLD_H); g.stroke(); }
  g.setLineDash([]);
  g.fillStyle = 'rgba(235,240,250,0.62)';
  for (const c of [9, 19]) {
    for (const cx of [c - 1, c + 2]) for (let yy = 7 * T + 6; yy < 9 * T - 6; yy += 14) g.fillRect(cx * T + 6, yy, T - 12, 7);
    for (const ry of [6, 9]) for (let xx = c * T + 6; xx < (c + 2) * T - 6; xx += 14) g.fillRect(xx, ry * T + 6, 7, T - 12);
  }
  // Pfützen, Ölflecken, Gullydeckel
  for (let i = 0; i < 26; i++) {
    let x, y, k = 0; do { x = R(0, WORLD_W); y = R(0, WORLD_H); k++; } while (grid[((y / T) | 0) * GW + ((x / T) | 0)] !== ROAD && k < 40);
    const rx = R(10, 34), ry = rx * R(0.4, 0.7), a = R(0, 3);
    g.fillStyle = 'rgba(20,26,44,0.26)'; g.beginPath(); g.ellipse(x, y, rx, ry, a, 0, TAU); g.fill();
    g.strokeStyle = 'rgba(140,180,240,0.18)'; g.lineWidth = 1.5; g.beginPath(); g.ellipse(x, y, rx, ry, a, 3.6, 5.4); g.stroke();
  }
  for (let i = 0; i < 30; i++) { const x = R(0, WORLD_W), y = R(0, WORLD_H); g.fillStyle = 'rgba(8,8,10,0.25)'; g.beginPath(); g.ellipse(x, y, R(6, 16), R(4, 10), R(0, 3), 0, TAU); g.fill(); }
  for (const [x, y] of [[8.5, 7.6], [11.4, 8.4], [9.6, 3.5], [20.4, 12.5], [15, 8.3]]) {
    g.fillStyle = '#1e2026'; g.beginPath(); g.arc(x * T, y * T, 11, 0, TAU); g.fill();
    g.strokeStyle = 'rgba(150,160,175,0.35)'; g.lineWidth = 2; g.stroke();
  }
  // Kontaktschatten am Gebäudefuß
  for (const b of buildings) {
    g.save(); g.filter = 'blur(7px)'; g.fillStyle = 'rgba(0,0,0,0.55)';
    g.fillRect(b.x0 - 6, b.y0 - 6, b.x1 - b.x0 + 12, b.y1 - b.y0 + 12); g.restore();
  }
})();

// ------------------------------------------------------------------
// Fassaden & Dächer: je eine diffuse (Nacht) und eine Emissive-Textur
// Texturkoordinaten: x = entlang der Kante, y = 0 am Boden, y = h am Dach
// ------------------------------------------------------------------
const NEON = ['#ff3fa4', '#3fe8ff', '#9dff4a', '#a66bff', '#ffb35c'];
function makeFacade(L, h, style, shade) {
  const W = Math.max(8, Math.round(L)), H = Math.max(8, Math.round(h));
  const d = mk(W, H), e = mk(W, H), dg = d.getContext('2d'), eg = e.getContext('2d');
  dg.fillStyle = style === 'glass' ? '#141b29' : style === 'neon' ? '#1d1824' : '#1e2129'; dg.fillRect(0, 0, W, H);
  // Straßenlicht färbt die unteren Stockwerke warm
  const gr = dg.createLinearGradient(0, 0, 0, Math.min(H, 110)); gr.addColorStop(0, 'rgba(255,170,90,0.22)'); gr.addColorStop(1, 'rgba(255,170,90,0)');
  dg.fillStyle = gr; dg.fillRect(0, 0, W, Math.min(H, 110));
  const CW = style === 'glass' ? 10 : 14;
  for (let f = 1; f * FLOOR_H < H - 4; f++) {
    const y = f * FLOOR_H;
    dg.fillStyle = 'rgba(0,0,0,0.4)'; dg.fillRect(0, y - 1, W, 2);
    for (let x = 4; x + CW - 4 < W; x += CW) {
      dg.fillStyle = '#0a0d15'; dg.fillRect(x, y + 5, CW - 5, 11);
      if (rnd() < (style === 'glass' ? 0.34 : 0.27)) {

    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.6; ctx.drawImage(glowSprite('#3fe8ff'), mx - 22, my - 26, 44, 44);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; }
  // 6) Regen (Bildschirmraum)
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (!OFF.has('rain')) { ctx.strokeStyle = 'rgba(160,190,230,0.22)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i < 420; i++) { const x = (i * 197 + time * 3.1 * (1 + (i % 3) * 0.2)) % (VIEW_W + 40) - 20, y = (i * 263 + time * 17 * (1 + (i % 4) * 0.15)) % (VIEW_H + 40) - 20;
    ctx.moveTo(x, y); ctx.lineTo(x - 3, y + 13); }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(170,200,240,0.25)';
  for (let i = 0; i < 40; i++) { const x = (i * 331 + time * 7) % VIEW_W, y = (i * 173 + time * 3) % VIEW_H, r = ((time + i * 7) % 20) * 0.4;
    ctx.beginPath(); ctx.ellipse(x, y, r, r * 0.5, 0, 0, TAU); ctx.stroke(); } }
  // 7) Radar. Kein Soft-Light-Grade und keine eigene Vignette: beides steckt in der
  //    Dunkelheitsschicht (Soft-Light über 1280x720 kostet im Software-Raster ~2 ms)
  if (!OFF.has('radar')) drawRadar(C);
  requestAnimationFrame(render);
}
function drawRadar(C) {
  const Rr = 62, cx = VIEW_W - Rr - 16, cy = VIEW_H - Rr - 16, k = Rr / 700;
  ctx.save(); ctx.fillStyle = 'rgba(6,8,16,0.78)'; ctx.beginPath(); ctx.arc(cx, cy, Rr, 0, TAU); ctx.fill(); ctx.clip();
  ctx.fillStyle = 'rgba(63,232,255,0.22)';
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) if (grid[y * GW + x] === ROAD) ctx.fillRect(cx + (x * T - player.x) * k, cy + (y * T - player.y) * k, T * k + 0.5, T * k + 0.5);
  ctx.fillStyle = '#ff3fa4'; ctx.beginPath(); ctx.arc(cx + (marker.x - player.x) * k, cy + (marker.y - player.y) * k, 3.5, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ff2a3a'; for (const c of cars) if (c.police) { ctx.beginPath(); ctx.arc(cx + (c.x - player.x) * k, cy + (c.y - player.y) * k, 3, 0, TAU); ctx.fill(); }
  ctx.restore();
  ctx.strokeStyle = 'rgba(63,232,255,0.55)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(cx, cy, Rr, 0, TAU); ctx.stroke();
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(player.a); ctx.fillStyle = '#5fd4e6';
  ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(-4, -4); ctx.lineTo(-4, 4); ctx.closePath(); ctx.fill(); ctx.restore();
}
// Fahndungs-Schlüssel (Symbol der Erben - Vorausdeutung)
document.getElementById('keys').innerHTML = [1, 1, 0, 0, 0].map(on =>
  `<svg viewBox="0 0 18 18"><circle cx="6" cy="9" r="4" fill="none" stroke="${on ? '#ffd84a' : '#4a4f5c'}" stroke-width="2"/>` +
  `<path d="M10 9h7M14 9v3M16.5 9v2" stroke="${on ? '#ffd84a' : '#4a4f5c'}" stroke-width="2" fill="none"/></svg>`).join('');
loadPack(() => requestAnimationFrame(render));
